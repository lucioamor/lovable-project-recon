name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: packages/core
            workspace: "@nxlv-ai/lovable-core"
          - path: packages/profile-cost
            workspace: "@nxlv-ai/lovable-profile-cost"
          - path: packages/benchmarks
            workspace: "@nxlv-ai/lovable-benchmarks"
          - path: packages/recon
            workspace: "@nxlv-ai/lovable-recon"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: contains(fromJSON(needs.release.outputs.paths_released), matrix.path)
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: contains(fromJSON(needs.release.outputs.paths_released), matrix.path)
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
        if: contains(fromJSON(needs.release.outputs.paths_released), matrix.path)
      - run: npm run build
        if: contains(fromJSON(needs.release.outputs.paths_released), matrix.path)
      - run: npm publish --workspace ${{ matrix.workspace }} --provenance --access public
        if: contains(fromJSON(needs.release.outputs.paths_released), matrix.path)
